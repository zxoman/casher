<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشتريات - نظام الكاشير</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="logo"><span id="shopNameDisplay">...</span></div>
      <nav></nav>
      <div class="user-footer">
        <div class="avatar" id="userAvatar">م</div>
        <div>
          <div class="user-name" id="userNameDisplay"></div>
          <div class="user-role" id="userRoleDisplay"></div>
        </div>
        <a href="#" id="logoutBtn" title="تسجيل الخروج" style="color:var(--danger);text-decoration:none;font-size:18px;">🚪</a>
      </div>
    </aside>
    <main class="main-content">
      <div class="header">
        <h2>إدارة المشتريات</h2>
        <button class="btn btn-sm btn-primary" id="addPurchaseBtn" onclick="showPurchaseModal()" style="${window.can('purchases','a')?'':'display:none'}">➕ فاتورة شراء جديدة</button>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="بحث باسم المورد أو باركود المنتج..." oninput="loadPurchases()">
      </div>
      <div class="table-container">
        <table>
          <thead><tr><th>رقم الفاتورة</th><th>المورد</th><th>عدد المنتجات</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>التاريخ</th><th></th></tr></thead>
          <tbody id="purchasesTable"></tbody>
        </table>
      </div>
    </main>
  </div>
  <div id="purchaseModal" class="modal-overlay" style="display:none;">
    <div class="modal" style="width:600px;">
      <h2>فاتورة شراء جديدة</h2>
      <form id="purchaseForm">
        <div class="form-row">
          <div class="form-group"><label>المورد</label><select id="purSupplier"></select></div>
          <div class="form-group"><label>رقم الفاتورة (اختياري)</label><input type="text" id="purInvoice" placeholder="سيتم إنشاؤه تلقائياً إذا ترك فارغاً"></div>
        </div>
        <div class="form-group"><label>المنتج والكمية</label></div>
        <div class="form-row">
          <div class="form-group" style="position:relative;"><label>المنتج</label>
            <input type="text" id="purProductInput" placeholder="ابحث بالاسم أو الباركود..." autocomplete="off" autofocus oninput="filterPurchaseProducts()" onkeydown="if(event.key==='Enter')event.preventDefault()" onblur="setTimeout(()=>hidePurchaseProductSuggestions(),200)">
            <input type="hidden" id="purProductId">
            <div id="purProductSuggestions" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #ccc;border-radius:8px;max-height:200px;overflow-y:auto;z-index:100;box-shadow:0 6px 16px rgba(0,0,0,0.2);"></div>
          </div>
          <div class="form-group"><label>الكمية</label><input type="number" id="purQty" value="1" min="1" style="width:70px"></div>
          <div class="form-group"><label>السعر</label>
            <input type="number" id="purPrice" placeholder="سعر الشراء" step="0.01">
            <span style="font-size:11px;color:var(--text-secondary);" id="purPriceHint"></span>
          </div>
          <div class="form-group" style="align-self:flex-end"><button type="button" class="btn btn-sm btn-primary" onclick="addPurchaseItem()" style="margin-top:22px;">➕</button></div>
        </div>
        <div style="max-height:200px;overflow-y:auto;margin-bottom:12px;">
          <table><thead><tr><th>المنتج</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead>
            <tbody id="purchaseItemsList"></tbody>
          </table>
        </div>
        <div class="form-row">
          <div style="display:flex;gap:8px;align-items:center;">
            <div class="form-group" style="flex:1;"><label>الإجمالي</label><input type="number" id="purTotal" readonly></div>
            <div class="form-group" style="flex:1;"><label>عدد القطع</label><input type="text" id="purItemCount" readonly value="0" style="font-weight:700;"></div>
          </div>
          <div class="form-group"><label>المدفوع</label><input type="number" id="purPaid" value="0"></div>
          <div class="form-group"><label>جهة الدفع</label><select id="purPaymentSource" onchange="togglePurDrawerType()">
            <option value="">نقدي</option>
            <option value="treasury">من الخزينة</option>
            <option value="drawer">من الدرج</option>
            <option value="credit">آجل</option>
          </select></div>
          <div class="form-group" id="purDrawerTypeGroup" style="display:none;"><label>نوع الدرج</label><select id="purDrawerType">
            <option value="cash">نقدي</option>
            <option value="vodafone">فودافون كاش</option>
            <option value="instapay">انستاباي</option>
          </select></div>
        </div>
        <button type="submit" class="btn btn-primary">حفظ الفاتورة</button>
        <button type="button" class="btn" style="background:var(--border);margin-top:8px;" onclick="closeModal('purchaseModal')">إلغاء</button>
      </form>
    </div>
  </div>
  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) { window.location.href = 'login.html'; throw new Error('login required'); }

    let purchaseItems = [];
    let editPurchaseId = null;
    let oldPurchaseItems = [];
    let oldTotal = 0;
    let oldPaid = 0;
    let allPurchaseProducts = [];
    let purchaseContainerLinks = {};

    async function loadPurchaseCompositions() {
      purchaseContainerLinks = {};
      const links = await window.api.db.all("SELECT * FROM product_compositions");
      for (const l of links) purchaseContainerLinks[l.container_id] = { unitId: l.unit_id, unitsPerContainer: l.units_per_container };
    }

    async function syncPurchaseContainerStock(unitId) {
      for (const cid of Object.keys(purchaseContainerLinks)) {
        const link = purchaseContainerLinks[cid];
        if (link.unitId === unitId) {
          const unit = await window.api.db.get("SELECT stock FROM products WHERE id=?", [unitId]);
          const derived = Math.floor((unit ? unit.stock : 0) / link.unitsPerContainer);
          await window.api.db.run("UPDATE products SET stock = ? WHERE id = ?", [derived, cid]);
        }
      }
    }

    async function adjustPurchaseStock(productId, qtyDelta) {
      const link = purchaseContainerLinks[productId];
      if (link) {
        await window.api.db.run('UPDATE products SET stock = stock + ? WHERE id = ?', [qtyDelta * link.unitsPerContainer, link.unitId]);
        await syncPurchaseContainerStock(link.unitId);
      } else {
        await window.api.db.run('UPDATE products SET stock = stock + ? WHERE id = ?', [qtyDelta, productId]);
        await syncPurchaseContainerStock(productId);
      }
    }

    function filterPurchaseProducts() {
      const q = document.getElementById('purProductInput').value.trim().toLowerCase();
      const container = document.getElementById('purProductSuggestions');
      document.getElementById('purProductId').value = '';
      document.getElementById('purPrice').value = '';
      document.getElementById('purPriceHint').textContent = '';
      if (!q) { container.style.display = 'none'; return; }
      const filtered = allPurchaseProducts.filter(p => p.name.toLowerCase().includes(q) || (p.barcode && p.barcode.toLowerCase().includes(q)));
      if (filtered.length === 0) { container.style.display = 'none'; return; }
      if (filtered.length === 1) {
        selectPurchaseProductEl(filtered[0]);
        container.style.display = 'none';
        return;
      }
      container.innerHTML = filtered.map(p =>
        `<div data-id="${p.id}" data-price="${p.buy_price}" data-name="${p.name.replace(/"/g,'&quot;')}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #000;font-size:13px;color:#000;font-weight: 1000;" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''" onclick="selectPurchaseProduct(this)">${p.name} — ${Number(p.buy_price).toLocaleString()} <span style="font-size:11px;color:var(--text-secondary)">📦 ${p.stock||0}</span> ${p.barcode ? '('+p.barcode+')' : ''}</div>`
      ).join('');
      container.style.display = 'block';
    }

    function selectPurchaseProductEl(p) {
      document.getElementById('purProductId').value = p.id;
      document.getElementById('purProductInput').value = p.name;
      document.getElementById('purPrice').value = p.buy_price || '';
      document.getElementById('purPriceHint').textContent = p.buy_price ? `(آخر سعر: ${Number(p.buy_price).toLocaleString()})` : '';
      document.getElementById('purQty').focus();
    }

    function selectPurchaseProduct(el) {
      const id = parseInt(el.dataset.id);
      const price = parseFloat(el.dataset.price) || 0;
      const name = el.dataset.name || '';
      selectPurchaseProductEl({ id, name, buy_price: price });
      document.getElementById('purProductSuggestions').style.display = 'none';
    }

    function hidePurchaseProductSuggestions() {
      document.getElementById('purProductSuggestions').style.display = 'none';
    }

    async function loadPurchases() {
      const q = document.getElementById('searchInput').value.trim();
      let sql = "SELECT DISTINCT pu.*, s.name as supplier_name, (SELECT COUNT(*) FROM purchase_items pi WHERE pi.purchase_id = pu.id) as items_count FROM purchases pu LEFT JOIN suppliers s ON pu.supplier_id = s.id";
      let params = [];
      if (q) {
        sql += " LEFT JOIN purchase_items pi ON pi.purchase_id = pu.id LEFT JOIN products p ON pi.product_id = p.id WHERE s.name LIKE ? OR p.barcode LIKE ?";
        params.push(`%${q}%`, `%${q}%`);
      }
      sql += " ORDER BY pu.created_at DESC";
      const purchases = await window.api.db.all(sql, params);
      document.getElementById('purchasesTable').innerHTML = purchases.map(p =>
        `<tr><td>${p.invoice_number}</td><td>${p.supplier_name || '-'}</td>
          <td style="font-weight:700;text-align:center">${p.items_count || 0}</td>
          <td>${Number(p.total_amount).toLocaleString()}</td><td>${Number(p.paid_amount).toLocaleString()}</td>
          <td style="color:${p.remaining_amount > 0 ? 'var(--danger)' : 'var(--success)'}">${Number(p.remaining_amount).toLocaleString()}</td>
          <td>${p.created_at}</td>
          <td>${window.can('purchases','e') ? `<button class="btn btn-sm" onclick="editPurchase(${p.id})" style="background:var(--accent);color:#fff">✏️</button>` : ''}</td></tr>`
      ).join('');
    }

    async function showPurchaseModal() {
      editPurchaseId = null;
      oldPurchaseItems = [];
      oldTotal = 0;
      oldPaid = 0;
      purchaseItems = [];
      document.getElementById('purchaseForm').reset();
      document.getElementById('purchaseItemsList').innerHTML = '';
      document.getElementById('purTotal').value = 0;
      document.getElementById('purchaseModal').style.display = 'flex';
      document.querySelector('#purchaseModal h2').textContent = 'فاتورة شراء جديدة';
      document.querySelector('#purchaseModal button[type="submit"]').textContent = 'حفظ الفاتورة';
      document.getElementById('purDrawerTypeGroup').style.display = 'none';

      const suppliers = await window.api.db.all("SELECT * FROM suppliers ORDER BY name");
      const sel = document.getElementById('purSupplier');
      sel.innerHTML = '<option value="">اختر مورد</option>' + suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

      allPurchaseProducts = await window.api.db.all("SELECT * FROM products ORDER BY name");
    }

    async function editPurchase(id) {
      const purchase = await window.api.db.get("SELECT * FROM purchases WHERE id=?", [id]);
      if (!purchase) { window.showAlert('الفاتورة غير موجودة', 'error'); return; }
      const items = await window.api.db.all("SELECT * FROM purchase_items WHERE purchase_id=?", [id]);

      editPurchaseId = id;
      oldTotal = purchase.total_amount;
      oldPaid = purchase.paid_amount;

      purchaseItems = [];
      oldPurchaseItems = [];
      for (const item of items) {
        const prod = await window.api.db.get("SELECT * FROM products WHERE id=?", [item.product_id]);
        const itemData = {
          product_id: item.product_id,
          name: prod ? prod.name : 'منتج',
          qty: item.quantity,
          price: item.buy_price,
          total: item.total
        };
        purchaseItems.push({ ...itemData });
        oldPurchaseItems.push({ ...itemData });
      }

      document.getElementById('purchaseModal').style.display = 'flex';
      document.querySelector('#purchaseModal h2').textContent = 'تعديل فاتورة شراء - ' + purchase.invoice_number;
      document.querySelector('#purchaseModal button[type="submit"]').textContent = 'حفظ التعديلات';

      const suppliers = await window.api.db.all("SELECT * FROM suppliers ORDER BY name");
      const sel = document.getElementById('purSupplier');
      sel.innerHTML = '<option value="">اختر مورد</option>' + suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      if (purchase.supplier_id) sel.value = purchase.supplier_id;

      document.getElementById('purInvoice').value = purchase.invoice_number;
      document.getElementById('purPaid').value = purchase.paid_amount;
      if (purchase.payment_source) document.getElementById('purPaymentSource').value = purchase.payment_source;
      if (purchase.drawer_type) {
        document.getElementById('purDrawerType').value = purchase.drawer_type;
        document.getElementById('purDrawerTypeGroup').style.display = purchase.payment_source === 'drawer' ? 'flex' : 'none';
      }

      renderPurchaseItems();

      allPurchaseProducts = await window.api.db.all("SELECT * FROM products ORDER BY name");
    }

    function addPurchaseItem() {
      const prodId = parseInt(document.getElementById('purProductId').value);
      const qty = parseInt(document.getElementById('purQty').value) || 1;
      const price = parseFloat(document.getElementById('purPrice').value) || 0;
      const prodName = document.getElementById('purProductInput').value.trim();

      if (!prodId || !prodName) { window.showAlert('اختر منتج', 'error'); return; }
      if (qty <= 0) { window.showAlert('الكمية يجب أن تكون أكبر من 0', 'error'); return; }
      purchaseItems.push({ product_id: prodId, name: prodName, qty, price, total: qty * price });
      renderPurchaseItems();
      document.getElementById('purProductInput').value = '';
      document.getElementById('purProductId').value = '';
      document.getElementById('purQty').value = 1;
      document.getElementById('purPrice').value = '';
      document.getElementById('purPriceHint').textContent = '';
      document.getElementById('purProductInput').focus();
    }

    function renderPurchaseItems() {
      const tbody = document.getElementById('purchaseItemsList');
      tbody.innerHTML = purchaseItems.map((item, i) => {
        return `<tr><td>${item.name}</td><td>${item.qty}</td><td>${item.total}</td>
          <td><button type="button" class="btn btn-sm btn-danger" onclick="removePurchaseItem(${i})">✕</button></td></tr>`;
      }).join('');
      const total = purchaseItems.reduce((s, x) => s + x.total, 0);
      const count = purchaseItems.reduce((s, x) => s + x.qty, 0);
      document.getElementById('purTotal').value = total;
      document.getElementById('purItemCount').value = count;
    }

    function removePurchaseItem(i) { purchaseItems.splice(i, 1); renderPurchaseItems(); }

    document.getElementById('purchaseForm').addEventListener('keydown', function(e) { if (e.key === 'Enter') e.preventDefault(); });
    document.getElementById('purchaseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (purchaseItems.length === 0) { window.showAlert('أضف منتجات على الأقل', 'error'); return; }
      const supplierId = document.getElementById('purSupplier').value || null;
      const invoiceNum = document.getElementById('purInvoice').value || ('PUR-' + Date.now());
      const total = purchaseItems.reduce((s, x) => s + x.total, 0);
      const paid = parseFloat(document.getElementById('purPaid').value) || 0;
      const remaining = total - paid;
      const paymentSource = document.getElementById('purPaymentSource').value;
      const drawerType = document.getElementById('purDrawerType').value;

      if (paid > 0 && (paymentSource === 'treasury' || paymentSource === 'drawer')) {
        const bal = await window.api.cash.getBalance();
        let balance;
        if (paymentSource === 'drawer') {
          balance = drawerType === 'cash' ? bal.drawer_cash : drawerType === 'vodafone' ? bal.drawer_vodafone : bal.drawer_instapay;
        } else {
          balance = bal.treasury;
        }
        if (paid > balance) {
          window.showAlert(`الرصيد غير كافٍ!\nالرصيد المتاح: ${balance.toLocaleString()}\nالمطلوب: ${paid.toLocaleString()}`, 'error'); return;
        }
      }

      if (editPurchaseId) {
        // --- EDIT MODE ---
        // Calculate extra cost from quantity increases
        let extraCost = 0;
        const oldMap = {};
        for (const o of oldPurchaseItems) oldMap[o.product_id] = o;
        for (const item of purchaseItems) {
          const oldQty = (oldMap[item.product_id] && oldMap[item.product_id].qty) || 0;
          const increase = item.qty - oldQty;
          if (increase > 0) extraCost += increase * item.price;
        }
        // New items not in old
        const oldIds = new Set(oldPurchaseItems.map(o => o.product_id));
        for (const item of purchaseItems) {
          if (!oldIds.has(item.product_id)) extraCost += item.qty * item.price;
        }

        // Deduct extra cost from treasury (as user requested: من الخزنه)
        if (extraCost > 0) {
          const bal = await window.api.cash.getBalance();
          if (extraCost > bal.treasury) {
            window.showAlert(`الرصيد في الخزينة غير كافٍ لخصم الزيادة!\nالرصيد: ${bal.treasury.toLocaleString()}\nالمطلوب: ${extraCost.toLocaleString()}`, 'error'); return;
          }
          await window.api.cash.addTreasuryEntry(-extraCost, 'تعديل مشتريات (زيادة كميات) - ' + invoiceNum);
        }

        // Update purchase items: delete old, insert new
        await window.api.db.run('DELETE FROM purchase_items WHERE purchase_id=?', [editPurchaseId]);
        for (const item of purchaseItems) {
          await window.api.db.run('INSERT INTO purchase_items (purchase_id, product_id, quantity, buy_price, total) VALUES (?, ?, ?, ?, ?)', [editPurchaseId, item.product_id, item.qty, item.price, item.total]);
        }

        // Update stock: reverse old, apply new
        for (const o of oldPurchaseItems) {
          await adjustPurchaseStock(o.product_id, -o.qty);
        }
        for (const item of purchaseItems) {
          await adjustPurchaseStock(item.product_id, item.qty);
          await window.api.db.run('UPDATE products SET buy_price = ? WHERE id = ?', [item.price, item.product_id]);
        }

        // Handle additional payment from treasury/drawer
        const extraPayment = Math.max(0, paid - oldPaid);
        if (extraPayment > 0 && (paymentSource === 'treasury' || paymentSource === 'drawer')) {
          const bal = await window.api.cash.getBalance();
          let balance;
          if (paymentSource === 'drawer') {
            balance = drawerType === 'cash' ? bal.drawer_cash : drawerType === 'vodafone' ? bal.drawer_vodafone : bal.drawer_instapay;
          } else {
            balance = bal.treasury;
          }
          if (extraPayment > balance) {
            window.showAlert(`الرصيد غير كافٍ!\nالرصيد المتاح: ${balance.toLocaleString()}\nالمطلوب: ${extraPayment.toLocaleString()}`, 'error'); return;
          }
          if (paymentSource === 'treasury') {
            await window.api.cash.addTreasuryEntry(-extraPayment, 'تسديد مشتريات - ' + invoiceNum);
          } else {
            const dtLabels = { cash: 'نقدي', vodafone: 'فودافون كاش', instapay: 'انستاباي' };
            await window.api.cash.addDrawerEntry(dtLabels[drawerType], -extraPayment, 'تسديد مشتريات - ' + invoiceNum);
          }
        }

        // Update purchase record
        await window.api.db.run('UPDATE purchases SET supplier_id=?, total_amount=?, paid_amount=?, remaining_amount=?, payment_source=?, drawer_type=? WHERE id=?', [supplierId, total, paid, remaining, paymentSource, paymentSource === 'drawer' ? drawerType : null, editPurchaseId]);

        const supName = supplierId ? document.getElementById('purSupplier').selectedOptions[0]?.textContent : 'نقدي';
        const sourceLabels = { treasury: 'من الخزينة', drawer: 'من الدرج', credit: 'آجل', '': 'نقدي' };
        let paymentSourceLabel = sourceLabels[paymentSource] || 'نقدي';
        if (paymentSource === 'drawer') {
          const dtLabels = { cash: 'نقدي', vodafone: 'فودافون كاش', instapay: 'انستاباي' };
          paymentSourceLabel += ' (' + dtLabels[drawerType] + ')';
        }
        await window.api.telegram.sendNotification('purchase', { invoice: invoiceNum, total, paid, remaining, paymentSource: paymentSourceLabel + ' (تعديل)', supplier: supName });
        editPurchaseId = null;
        closeModal('purchaseModal');
        loadPurchases();
        window.showAlert('تم تعديل فاتورة الشراء بنجاح');
      } else {
        // --- CREATE MODE ---
        const result = await window.api.db.run('INSERT INTO purchases (supplier_id, user_id, invoice_number, total_amount, paid_amount, remaining_amount, payment_source, drawer_type) VALUES (?, ?, ?, ?, ?, ?, ?, ?)', [supplierId, user.id, invoiceNum, total, paid, remaining, paymentSource, paymentSource === 'drawer' ? drawerType : null]);

        for (const item of purchaseItems) {
          await window.api.db.run('INSERT INTO purchase_items (purchase_id, product_id, quantity, buy_price, total) VALUES (?, ?, ?, ?, ?)', [result.lastInsertRowid, item.product_id, item.qty, item.price, item.total]);
          await adjustPurchaseStock(item.product_id, item.qty);
          await window.api.db.run('UPDATE products SET buy_price = ? WHERE id = ?', [item.price, item.product_id]);
        }

        if (paid > 0 && paymentSource === 'treasury') {
          await window.api.cash.addTreasuryEntry(-paid, 'مشتريات - ' + invoiceNum);
        } else if (paid > 0 && paymentSource === 'drawer') {
          const dtLabels = { cash: 'نقدي', vodafone: 'فودافون كاش', instapay: 'انستاباي' };
          await window.api.cash.addDrawerEntry(dtLabels[drawerType], -paid, 'مشتريات - ' + invoiceNum);
        }

        const supName = supplierId ? document.getElementById('purSupplier').selectedOptions[0]?.textContent : 'نقدي';
        const sourceLabels = { treasury: 'من الخزينة', drawer: 'من الدرج', credit: 'آجل', '': 'نقدي' };
        let paymentSourceLabel = sourceLabels[paymentSource] || 'نقدي';
        if (paymentSource === 'drawer') {
          const dtLabels = { cash: 'نقدي', vodafone: 'فودافون كاش', instapay: 'انستاباي' };
          paymentSourceLabel += ' (' + dtLabels[drawerType] + ')';
        }
        await window.api.telegram.sendNotification('purchase', { invoice: invoiceNum, total, paid, remaining, paymentSource: paymentSourceLabel, supplier: supName });
        closeModal('purchaseModal');
        loadPurchases();
        window.showAlert('تم حفظ فاتورة الشراء بنجاح');
      }
    });

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    loadPurchaseCompositions();
    loadPurchases();

  </script>
  <script src="../js/sidebar.js"></script>
</body>
</html>
