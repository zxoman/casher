<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#1a73e8;font-family:sans-serif;}
  .box{text-align:center;color:#fff;}
  h2{margin:0 0 8px;font-size:24px;font-weight:700;}
  p{margin:0 0 24px;font-size:15px;opacity:0.85;}
  .spinner{width:40px;height:40px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <h2>نظام الكاشير</h2>
  <p>جاري التحميل...</p>
  <div id="clock" style="font-size:13px;opacity:0.7;margin-bottom:16px;"></div>
  <div class="spinner"></div>
</div>
<script>
  function updateClock() {
    document.getElementById('clock').textContent = new Date().toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
